<!DOCTYPE html>
<html>
  <body style="font-family: Arial, sans-serif; color: #1f2937; line-height: 1.5;">
    <table width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;margin:0 auto;padding:24px;">
      <tr><td>
        <h2 style="margin:0 0 12px;color:#1F4E5F;">{{ app_name }}</h2>
        <p>Hello {{ name }},</p>
        <p>Please confirm this email address to complete the change on your account.</p>
        <p style="margin:24px 0;">
          <a href="{{ verify_url }}" style="background:#1F4E5F;color:#fff;padding:12px 18px;text-decoration:none;border-radius:6px;display:inline-block;">
            Verify Email
          </a>
        </p>
        <p style="font-size:13px;color:#6b7280;">If the button does not work, open this link:<br>{{ verify_url }}</p>
        <p style="font-size:13px;color:#6b7280;">This link expires in 24 hours.</p>
      </td></tr>
    </table>
  </body>
</html>
