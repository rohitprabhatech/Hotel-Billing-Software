<!DOCTYPE html>
<html>
  <body style="font-family: Arial, sans-serif; color: #1f2937; line-height: 1.5;">
    <table width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;margin:0 auto;padding:24px;">
      <tr><td>
        <h2 style="margin:0 0 12px;color:#1F4E5F;">{{ business_name }}</h2>
        <p>Hello {{ customer_name }},</p>
        <p>Please find your bill attached as a PDF.</p>
        <p>
          <strong>Bill:</strong> {{ bill_number }}<br />
          <strong>Amount:</strong> ₹{{ amount }}
        </p>
        <p style="color:#6b7280;font-size:13px;">Sent via {{ app_name }}.</p>
      </td></tr>
    </table>
  </body>
</html>
