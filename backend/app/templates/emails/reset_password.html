<!DOCTYPE html>
<html>
  <body style="font-family: Arial, sans-serif; color: #1f2937; line-height: 1.5;">
    <table width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;margin:0 auto;padding:24px;">
      <tr><td>
        <h2 style="margin:0 0 12px;color:#1F4E5F;">{{ app_name }}</h2>
        <p>Hello {{ name }},</p>
        <p>We received a request to reset your password. Click below to choose a new password.</p>
        <p style="margin:24px 0;">
          <a href="{{ reset_url }}" style="background:#1F4E5F;color:#fff;padding:12px 18px;text-decoration:none;border-radius:6px;display:inline-block;">
            Reset Password
          </a>
        </p>
        <p style="font-size:13px;color:#6b7280;">If you did not request this, you can ignore this email.</p>
        <p style="font-size:13px;color:#6b7280;">This link expires in 1 hour and can be used once.</p>
      </td></tr>
    </table>
  </body>
</html>
